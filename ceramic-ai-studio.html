<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ปั้นดิน — ออกแบบเซรามิกด้วย AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --celadon:#7C8D77;
    --celadon-dark:#54634F;
    --kiln:#2B2622;
    --biscuit:#C9AD8C;
    --stone-bg:#EAE4D8;
    --stone-bg2:#DDD4C0;
    --gold:#B8935A;
    --iron:#8B4A3A;
    --paper:#F6F2E9;
    --ink:#2B2622;
    --ink-soft:#6B6357;
    --line: rgba(43,38,34,0.14);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(124,141,119,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(184,147,90,0.10), transparent 55%),
      var(--stone-bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Thai', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{ font-family:'Noto Serif Thai', serif; }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em; }
  #app{ max-width:980px; margin:0 auto; padding: 28px 20px 80px; }

  /* ---- Header / Wheel Stepper ---- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
  .brand{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .brand .mark{ width:34px;height:34px; border-radius:50%; background:conic-gradient(var(--celadon), var(--biscuit), var(--gold), var(--celadon)); box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 4px var(--kiln);}
  .brand .name{ font-family:'Noto Serif Thai',serif; font-weight:700; font-size:1.15rem; }
  .brand .name span{ color:var(--celadon-dark); }

  .wheel-nav{ display:flex; flex-direction:column; align-items:center; gap:6px; margin: 6px auto 34px; }
  .wheel{ position:relative; width:120px; height:120px; }
  .wheel svg{ width:100%; height:100%; transition: transform 0.6s cubic-bezier(.4,0,.2,1); }
  .wheel .hub{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:10px;height:10px;border-radius:50%; background:var(--kiln);}
  .wheel-label{ font-size:0.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.08em; }
  .wheel-step-name{ font-family:'Noto Serif Thai',serif; font-weight:600; font-size:1rem; color:var(--kiln); }

  /* ---- Generic layout ---- */
  .screen{ animation: rise .45s ease; }
  @keyframes rise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--celadon-dark); margin-bottom:8px;}
  .lead{ color:var(--ink-soft); font-size:1rem; line-height:1.7; max-width:640px; }
  h1.title{ font-size:2.1rem; margin:0 0 10px; line-height:1.25;}
  h2.title{ font-size:1.55rem; margin:0 0 8px;}

  .btn{ font-family:'IBM Plex Sans Thai',sans-serif; font-weight:600; border:none; cursor:pointer; padding:13px 26px; border-radius:999px; font-size:0.95rem; transition: transform .15s ease, box-shadow .15s ease; }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background:var(--kiln); color:var(--paper); box-shadow: 0 6px 18px rgba(43,38,34,0.22);}
  .btn-primary:hover{ background:#1c1815; }
  .btn-primary:disabled{ background:#B7B0A2; cursor:not-allowed; box-shadow:none;}
  .btn-ghost{ background:transparent; color:var(--kiln); border:1.5px solid var(--line); }
  .btn-ghost:hover{ border-color:var(--kiln); }
  .btn-row{ display:flex; gap:12px; margin-top:28px; flex-wrap:wrap; }

  .card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); }

  /* ---- Home ---- */
  .hero{ display:grid; grid-template-columns: 1.1fr 0.9fr; gap:34px; align-items:center; margin-bottom:50px;}
  @media (max-width:760px){ .hero{grid-template-columns:1fr;} }
  .hero-visual{ display:flex; justify-content:center; align-items:center; position:relative; }
  .hero-visual .ring{ position:absolute; width:280px;height:280px;border-radius:50%; border:1px dashed var(--line); animation: spin 40s linear infinite;}
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .section-title{ display:flex; align-items:baseline; justify-content:space-between; margin: 46px 0 16px;}
  .gallery{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:760px){ .gallery{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:480px){ .gallery{grid-template-columns:1fr;} }
  .piece-card{ padding:16px; display:flex; flex-direction:column; gap:10px; }
  .piece-card svg{ width:100%; height:150px; }
  .piece-name{ font-weight:600; font-size:0.95rem; }
  .diff-badge{ display:inline-flex; align-items:center; gap:5px; font-size:0.72rem; padding:3px 10px; border-radius:999px; width:fit-content; font-family:'IBM Plex Mono',monospace; }
  .diff-1,.diff-2{ background: rgba(124,141,119,0.18); color:var(--celadon-dark); }
  .diff-3{ background: rgba(184,147,90,0.2); color:#8a6a2f; }
  .diff-4,.diff-5{ background: rgba(139,74,58,0.15); color:var(--iron); }

  /* ---- Idea input ---- */
  .idea-box{ position:relative; }
  textarea.idea-input{ width:100%; min-height:120px; font-family:'Noto Serif Thai',serif; font-size:1.2rem; padding:18px; border-radius:var(--radius); border:1.5px solid var(--line); background:var(--paper); resize:vertical; color:var(--ink); }
  textarea.idea-input:focus{ outline:none; border-color:var(--celadon); }
  .chips{ display:flex; gap:9px; flex-wrap:wrap; margin-top:14px; }
  .chip{ padding:8px 15px; border-radius:999px; border:1px solid var(--line); background:var(--paper); font-size:0.85rem; cursor:pointer; color:var(--ink); }
  .chip:hover{ border-color:var(--celadon); background: rgba(124,141,119,0.08); }
  .vague-warn{ margin-top:16px; padding:14px 16px; border-radius:10px; background: rgba(184,147,90,0.14); border:1px solid rgba(184,147,90,0.35); font-size:0.9rem; color:#6b4f22; }

  /* ---- Skill level ---- */
  .skill-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:22px; }
  @media (max-width:700px){ .skill-grid{grid-template-columns:1fr;} }
  .skill-card{ padding:22px; cursor:pointer; transition: border-color .15s, transform .15s; }
  .skill-card:hover{ transform:translateY(-3px); }
  .skill-card.selected{ border-color:var(--kiln); box-shadow: 0 8px 20px rgba(43,38,34,0.14); }
  .skill-card .lvl-mark{ width:34px;height:34px;border-radius:50%; margin-bottom:14px; }
  .skill-card h3{ margin:0 0 6px; font-size:1.05rem; }
  .skill-card p{ margin:0; font-size:0.85rem; color:var(--ink-soft); line-height:1.6; }

  /* ---- Loading ---- */
  .loading-wrap{ display:flex; flex-direction:column; align-items:center; padding:70px 0; gap:18px; }
  .throwing{ width:90px;height:90px; }
  .throwing svg{ animation: spin 1.4s linear infinite; }
  .loading-text{ color:var(--ink-soft); font-size:0.95rem; }

  /* ---- Results grid ---- */
  .results-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; margin-top:22px; }
  .design-card{ padding:16px; display:flex; flex-direction:column; gap:10px; position:relative; border:1.5px solid var(--line); }
  .design-card.picked{ border-color:var(--celadon-dark); background: rgba(124,141,119,0.06); }
  .design-card svg{ width:100%; height:170px; }
  .design-card .why{ font-size:0.82rem; color:var(--ink-soft); line-height:1.55; flex:1; }
  .pick-toggle{ position:absolute; top:14px; right:14px; width:24px;height:24px;border-radius:50%; border:1.5px solid var(--line); background:var(--paper); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:0.8rem; }
  .design-card.picked .pick-toggle{ background:var(--celadon-dark); color:#fff; border-color:var(--celadon-dark); }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }

  /* ---- Compare ---- */
  .compare-grid{ display:grid; gap:16px; margin-top:22px; }
  .compare-row{ display:grid; grid-template-columns: 160px repeat(auto-fit,minmax(160px,1fr)); gap:14px; padding:14px 0; border-bottom:1px solid var(--line); align-items:center; }
  .compare-row:first-child{ font-family:'IBM Plex Mono',monospace; font-size:0.75rem; text-transform:uppercase; color:var(--ink-soft); letter-spacing:0.05em; }
  .compare-label{ font-weight:600; font-size:0.85rem; color:var(--ink-soft); }
  .compare-visual svg{ width:100%; height:120px; }
  .stars{ color:var(--gold); letter-spacing:2px; }

  /* ---- Customize ---- */
  .customize-layout{ display:grid; grid-template-columns: 1fr 1.1fr; gap:34px; margin-top:22px; }
  @media (max-width:760px){ .customize-layout{grid-template-columns:1fr;} }
  .customize-preview{ padding:24px; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .customize-preview svg{ width:220px; height:280px; }
  .diff-live{ font-family:'IBM Plex Mono',monospace; font-size:0.8rem; }
  .warn-banner{ margin-top:6px; padding:10px 14px; border-radius:10px; background: rgba(139,74,58,0.12); border:1px solid rgba(139,74,58,0.3); color:var(--iron); font-size:0.82rem; }
  .control-group{ margin-bottom:22px; }
  .control-group label{ display:flex; justify-content:space-between; font-size:0.85rem; font-weight:600; margin-bottom:8px;}
  .control-group input[type=range]{ width:100%; accent-color:var(--celadon-dark); }
  .color-row{ display:flex; gap:14px; }
  .color-pick{ display:flex; flex-direction:column; gap:6px; font-size:0.8rem; color:var(--ink-soft); }
  .color-pick input[type=color]{ width:52px;height:36px; border:1px solid var(--line); border-radius:8px; padding:2px; background:var(--paper); }

  /* ---- Confirm ---- */
  .confirm-layout{ display:grid; grid-template-columns: 1fr 1.2fr; gap:34px; margin-top:22px; }
  @media (max-width:760px){ .confirm-layout{grid-template-columns:1fr;} }
  .confirm-visual{ padding:26px; text-align:center; }
  .confirm-visual svg{ width:220px;height:280px; }
  .steps-list{ list-style:none; margin:0; padding:0; counter-reset:step; }
  .steps-list li{ counter-increment:step; padding:12px 0 12px 40px; position:relative; border-bottom:1px solid var(--line); font-size:0.92rem; }
  .steps-list li::before{ content: counter(step); position:absolute; left:0; top:10px; width:24px;height:24px;border-radius:50%; background:var(--kiln); color:var(--paper); font-family:'IBM Plex Mono',monospace; font-size:0.75rem; display:flex; align-items:center; justify-content:center; }

  /* ---- 3D viewer ---- */
  .three-wrap{ position:relative; width:100%; height:360px; border-radius:var(--radius); overflow:hidden; cursor:grab;
    background: radial-gradient(circle at 50% 28%, rgba(255,255,255,0.55), rgba(221,212,192,0.55) 70%); }
  .three-wrap.dragging{ cursor:grabbing; }
  .three-wrap canvas{ display:block; touch-action:none; }
  .three-hint{ font-size:0.72rem; color:var(--ink-soft); text-align:center; margin-top:10px; }
  .three-fallback-note{ font-size:0.72rem; color:var(--ink-soft); text-align:center; margin-top:8px; }

  footer.note{ margin-top:60px; padding-top:20px; border-top:1px solid var(--line); font-size:0.78rem; color:var(--ink-soft); text-align:center; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   DATA / HELPERS
   ========================================================= */

const SHAPE_PROFILES = {
  vase: [ {y:0,x:0.24},{y:0.08,x:0.20},{y:0.18,x:0.34},{y:0.45,x:0.5},{y:0.7,x:0.4},{y:0.9,x:0.3},{y:1,x:0.27} ],
  bowl: [ {y:0,x:0.5},{y:0.15,x:0.47},{y:0.5,x:0.34},{y:0.85,x:0.15},{y:1,x:0.12} ],
  plate: [ {y:0,x:0.5},{y:0.08,x:0.5},{y:0.22,x:0.4},{y:0.85,x:0.38},{y:1,x:0.14} ],
  mug: [ {y:0,x:0.3},{y:0.05,x:0.3},{y:0.95,x:0.3},{y:1,x:0.28} ],
  jar: [ {y:0,x:0.17},{y:0.1,x:0.14},{y:0.25,x:0.4},{y:0.6,x:0.47},{y:0.85,x:0.34},{y:1,x:0.27} ],
  plant_pot: [ {y:0,x:0.46},{y:0.1,x:0.46},{y:0.9,x:0.3},{y:1,x:0.28} ],
};
const SHAPE_NAMES = { vase:'แจกัน', bowl:'ชาม', plate:'จาน', mug:'แก้วมัค', jar:'โถ', plant_pot:'กระถางต้นไม้' };
const PATTERN_NAMES = { floral:'ลายดอกไม้', geometric:'ลายเรขาคณิต', wave:'ลายคลื่น', dots:'ลายจุด', minimal_line:'เส้นมินิมอล', glaze_drip:'เคลือบหยดไหล', organic:'ลายอินทรีย์' };

function smoothSeg(pts){
  let d='';
  for(let i=0;i<pts.length-1;i++){
    const [x0,y0]=pts[i], [x1,y1]=pts[i+1];
    const mx=(x0+x1)/2, my=(y0+y1)/2;
    d += `Q ${x0.toFixed(1)} ${y0.toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)} `;
  }
  const last = pts[pts.length-1];
  d += `L ${last[0].toFixed(1)} ${last[1].toFixed(1)} `;
  return d;
}

function vesselPathD(shapeType, heightRatio){
  const profile = SHAPE_PROFILES[shapeType] || SHAPE_PROFILES.vase;
  const cx=110, topPad=14, maxHW=92;
  const h = Math.max(120, Math.min(230, 200*heightRatio));
  const leftPts = profile.map(p=>[cx - p.x*maxHW, topPad + p.y*h]);
  const rightPts = profile.map(p=>[cx + p.x*maxHW, topPad + p.y*h]).reverse();
  let d = `M ${leftPts[0][0].toFixed(1)} ${leftPts[0][1].toFixed(1)} `;
  d += smoothSeg(leftPts);
  d += `L ${rightPts[0][0].toFixed(1)} ${rightPts[0][1].toFixed(1)} `;
  d += smoothSeg(rightPts);
  d += 'Z';
  return d;
}

let patternCounter = 0;
function patternDefs(shapeType, patternType, accent, density){
  patternCounter++;
  const id = 'pat-' + patternCounter;
  const size = Math.max(10, 26 / (density||1));
  const s = size.toFixed(1);
  let inner = '';
  switch(patternType){
    case 'dots':
      inner = `<circle cx="${size/2}" cy="${size/2}" r="${(size*0.13).toFixed(1)}" fill="${accent}" />`;
      break;
    case 'geometric':
      inner = `<rect x="${size*0.25}" y="${size*0.25}" width="${size*0.5}" height="${size*0.5}" transform="rotate(45 ${size/2} ${size/2})" fill="none" stroke="${accent}" stroke-width="1.4" />`;
      break;
    case 'wave':
      inner = `<path d="M0 ${size/2} Q ${size/4} ${size*0.2} ${size/2} ${size/2} T ${size} ${size/2}" fill="none" stroke="${accent}" stroke-width="1.4" />`;
      break;
    case 'floral':
      inner = `<g fill="${accent}" opacity="0.9">
        <ellipse cx="${size/2}" cy="${size*0.32}" rx="${size*0.09}" ry="${size*0.16}" />
        <ellipse cx="${size/2}" cy="${size*0.68}" rx="${size*0.09}" ry="${size*0.16}" />
        <ellipse cx="${size*0.32}" cy="${size/2}" rx="${size*0.16}" ry="${size*0.09}" />
        <ellipse cx="${size*0.68}" cy="${size/2}" rx="${size*0.16}" ry="${size*0.09}" />
        <circle cx="${size/2}" cy="${size/2}" r="${size*0.07}" fill="${accent}" />
      </g>`;
      break;
    case 'glaze_drip':
      inner = `<path d="M${size*0.2} 0 C ${size*0.15} ${size*0.5}, ${size*0.28} ${size*0.6}, ${size*0.2} ${size} M${size*0.6} 0 C ${size*0.55} ${size*0.4}, ${size*0.68} ${size*0.55}, ${size*0.6} ${size}" fill="none" stroke="${accent}" stroke-width="1.6" opacity="0.8" />`;
      break;
    case 'minimal_line':
    default:
      inner = `<line x1="0" y1="${size*0.5}" x2="${size}" y2="${size*0.5}" stroke="${accent}" stroke-width="1" opacity="0.75" />`;
      break;
  }
  const defs = `<pattern id="${id}" width="${s}" height="${s}" patternUnits="userSpaceOnUse">${inner}</pattern>`;
  return { id, defs };
}

function renderVesselSVG(design, opts={}){
  const { shape_type, pattern_type, primary_color, accent_color } = design;
  const heightRatio = opts.heightRatio || 1;
  const density = opts.density || 1;
  const d = vesselPathD(shape_type, heightRatio);
  const { id, defs } = patternDefs(shape_type, pattern_type, accent_color, density);
  let handle = '';
  if(shape_type === 'mug'){
    handle = `<path d="M 202 70 C 235 70, 235 150, 202 150" fill="none" stroke="${primary_color}" stroke-width="14" stroke-linecap="round"/>`;
  }
  let lid = '';
  if(shape_type === 'jar'){
    lid = `<ellipse cx="110" cy="16" rx="16" ry="5" fill="${accent_color}" />`;
  }
  return `<svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
    <defs>${defs}</defs>
    ${handle}
    <path d="${d}" fill="${primary_color}" />
    <path d="${d}" fill="url(#${id})" opacity="0.9" />
    ${lid}
  </svg>`;
}

/* =========================================================
   3D VESSEL (three.js) — lathe-revolved profile, canvas texture
   ========================================================= */
const THREE_BASE_HEIGHT = 2.4;
const THREE_MAX_RADIUS = 1.15;

function buildLatheProfilePoints(shapeType, heightRatio){
  const profile = SHAPE_PROFILES[shapeType] || SHAPE_PROFILES.vase;
  const H = THREE_BASE_HEIGHT * heightRatio;
  const rev = [...profile].reverse(); // bottom(y=1) -> top(y=0)
  return rev.map(p => new THREE.Vector2(Math.max(0.02, p.x*THREE_MAX_RADIUS), (1-p.y)*H));
}
function buildLatheGeometry(shapeType, heightRatio){
  return new THREE.LatheGeometry(buildLatheProfilePoints(shapeType, heightRatio), 48);
}

function drawPatternOnCanvas(ctx, size, shapeType, patternType, primary, accent, density){
  ctx.fillStyle = primary;
  ctx.fillRect(0,0,size,size);
  const tile = Math.max(16, 40/(density||1));
  ctx.strokeStyle = accent; ctx.fillStyle = accent;
  for(let y=0; y<size+tile; y+=tile){
    for(let x=0; x<size+tile; x+=tile){
      ctx.save();
      ctx.translate(x,y);
      switch(patternType){
        case 'dots':
          ctx.beginPath(); ctx.arc(tile/2, tile/2, tile*0.11, 0, Math.PI*2); ctx.fill();
          break;
        case 'geometric':
          ctx.save(); ctx.translate(tile/2,tile/2); ctx.rotate(Math.PI/4);
          ctx.lineWidth = Math.max(1, tile*0.05); ctx.strokeRect(-tile*0.22,-tile*0.22, tile*0.44, tile*0.44);
          ctx.restore();
          break;
        case 'wave':
          ctx.lineWidth = Math.max(1, tile*0.06);
          ctx.beginPath();
          ctx.moveTo(0, tile*0.5);
          ctx.quadraticCurveTo(tile*0.25, tile*0.18, tile*0.5, tile*0.5);
          ctx.quadraticCurveTo(tile*0.75, tile*0.82, tile, tile*0.5);
          ctx.stroke();
          break;
        case 'floral':
          ctx.globalAlpha = 0.9;
          [[tile*0.5,tile*0.3],[tile*0.5,tile*0.7],[tile*0.3,tile*0.5],[tile*0.7,tile*0.5]].forEach(([ex,ey])=>{
            ctx.beginPath(); ctx.ellipse(ex,ey, tile*0.09, tile*0.16, Math.atan2(ey-tile*0.5, ex-tile*0.5)+Math.PI/2, 0, Math.PI*2); ctx.fill();
          });
          ctx.beginPath(); ctx.arc(tile*0.5, tile*0.5, tile*0.07, 0, Math.PI*2); ctx.fill();
          ctx.globalAlpha = 1;
          break;
        case 'glaze_drip':
          ctx.lineWidth = Math.max(1, tile*0.07); ctx.globalAlpha = 0.85;
          ctx.beginPath(); ctx.moveTo(tile*0.25,0); ctx.bezierCurveTo(tile*0.18,tile*0.5, tile*0.32,tile*0.6, tile*0.25,tile); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(tile*0.68,0); ctx.bezierCurveTo(tile*0.6,tile*0.4, tile*0.76,tile*0.55, tile*0.68,tile); ctx.stroke();
          ctx.globalAlpha = 1;
          break;
        case 'minimal_line':
        default:
          ctx.lineWidth = Math.max(1, tile*0.04); ctx.globalAlpha = 0.75;
          ctx.beginPath(); ctx.moveTo(0, tile*0.5); ctx.lineTo(tile, tile*0.5); ctx.stroke();
          ctx.globalAlpha = 1;
          break;
      }
      ctx.restore();
    }
  }
}
function makePatternCanvasTexture(shapeType, patternType, primary, accent, density){
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  drawPatternOnCanvas(ctx, size, shapeType, patternType, primary, accent, density);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(3, shapeType==='plate' ? 1 : 4);
  texture.needsUpdate = true;
  return texture;
}

function makePieceGroup(design, custom){
  const group = new THREE.Group();
  const bodyGeo = buildLatheGeometry(design.shape_type, custom.heightRatio);
  const tex = makePatternCanvasTexture(design.shape_type, design.pattern_type, custom.primary, custom.accent, custom.density);
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness:0.55, metalness:0.06, side: THREE.DoubleSide });
  const body = new THREE.Mesh(bodyGeo, mat);
  group.add(body);
  group.userData.body = body;
  group.userData.mat = mat;

  const H = THREE_BASE_HEIGHT * custom.heightRatio;
  if(design.shape_type === 'mug'){
    const handleGeo = new THREE.TorusGeometry(H*0.24, H*0.045, 12, 24, Math.PI*1.3);
    const handleMat = new THREE.MeshStandardMaterial({ color: custom.primary, roughness:0.6 });
    const handle = new THREE.Mesh(handleGeo, handleMat);
    handle.rotation.set(0, Math.PI/2, Math.PI/2);
    handle.position.set(THREE_MAX_RADIUS*0.3, H*0.5, 0);
    group.add(handle);
    group.userData.handle = handle; group.userData.handleMat = handleMat;
  }
  if(design.shape_type === 'jar'){
    const lidGeo = new THREE.CylinderGeometry(0.2, 0.22, 0.14, 24);
    const lidMat = new THREE.MeshStandardMaterial({ color: custom.accent, roughness:0.5 });
    const lid = new THREE.Mesh(lidGeo, lidMat);
    lid.position.set(0, H + 0.07, 0);
    group.add(lid);
    group.userData.lid = lid; group.userData.lidMat = lidMat;
  }
  return group;
}

function disposeThreeInstance(inst){
  if(!inst) return;
  if(inst.animId) cancelAnimationFrame(inst.animId);
  if(inst._listeners){
    const { dom, onDown, onMove, onUp, onWheel } = inst._listeners;
    dom.removeEventListener('pointerdown', onDown);
    dom.removeEventListener('pointermove', onMove);
    dom.removeEventListener('pointerup', onUp);
    dom.removeEventListener('pointerleave', onUp);
    dom.removeEventListener('wheel', onWheel);
  }
  if(inst.onResize) window.removeEventListener('resize', inst.onResize);
  inst.scene.traverse(obj=>{
    if(obj.geometry) obj.geometry.dispose();
    if(obj.material){
      if(obj.material.map) obj.material.map.dispose();
      obj.material.dispose();
    }
  });
  inst.renderer.dispose();
  if(inst.renderer.domElement && inst.renderer.domElement.parentNode){
    inst.renderer.domElement.parentNode.removeChild(inst.renderer.domElement);
  }
}

function buildThreeScene(containerId, design, custom, interactive){
  if(typeof THREE === 'undefined') return null;
  const container = document.getElementById(containerId);
  if(!container) return null;
  const w = container.clientWidth || 300, h = container.clientHeight || 360;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, w/h, 0.1, 100);
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(w,h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const key = new THREE.DirectionalLight(0xfff3e0, 0.9); key.position.set(3,5,4); scene.add(key);
  const fillL = new THREE.DirectionalLight(0xdfe8ff, 0.35); fillL.position.set(-4,2,-3); scene.add(fillL);

  const pedestal = new THREE.Mesh(
    new THREE.CylinderGeometry(1.5, 1.6, 0.22, 48),
    new THREE.MeshStandardMaterial({ color:0xC9AD8C, roughness:0.85 })
  );
  pedestal.position.y = -0.11;
  scene.add(pedestal);

  const piece = makePieceGroup(design, custom);
  scene.add(piece);

  const inst = { renderer, scene, camera, piece, design, custom, theta:0.6, phi:1.15, radius:4.4, dragging:false, lastX:0, lastY:0, animId:null };

  inst.updateCamera = function(){
    const targetY = (THREE_BASE_HEIGHT*inst.custom.heightRatio)/2;
    const x = inst.radius*Math.sin(inst.phi)*Math.sin(inst.theta);
    const y = inst.radius*Math.cos(inst.phi) + targetY*0.5;
    const z = inst.radius*Math.sin(inst.phi)*Math.cos(inst.theta);
    camera.position.set(x,y,z);
    camera.lookAt(0, targetY*0.5, 0);
  };
  inst.updateCamera();

  if(interactive){
    const dom = renderer.domElement;
    const onDown = (e)=>{ inst.dragging=true; inst.lastX=e.clientX; inst.lastY=e.clientY; container.classList.add('dragging'); try{dom.setPointerCapture(e.pointerId);}catch(err){} };
    const onMove = (e)=>{ if(!inst.dragging) return; const dx=e.clientX-inst.lastX, dy=e.clientY-inst.lastY; inst.theta -= dx*0.008; inst.phi = Math.max(0.35, Math.min(Math.PI-0.35, inst.phi - dy*0.008)); inst.lastX=e.clientX; inst.lastY=e.clientY; inst.updateCamera(); };
    const onUp = ()=>{ inst.dragging=false; container.classList.remove('dragging'); };
    const onWheel = (e)=>{ e.preventDefault(); inst.radius = Math.max(2.6, Math.min(7, inst.radius*(1+e.deltaY*0.0012))); inst.updateCamera(); };
    dom.addEventListener('pointerdown', onDown);
    dom.addEventListener('pointermove', onMove);
    dom.addEventListener('pointerup', onUp);
    dom.addEventListener('pointerleave', onUp);
    dom.addEventListener('wheel', onWheel, { passive:false });
    inst._listeners = { dom, onDown, onMove, onUp, onWheel };
  }

  inst.onResize = function(){
    const cw = container.clientWidth, ch = container.clientHeight;
    if(!cw || !ch) return;
    camera.aspect = cw/ch; camera.updateProjectionMatrix();
    renderer.setSize(cw,ch);
  };
  window.addEventListener('resize', inst.onResize);

  (function animate(){
    inst.animId = requestAnimationFrame(animate);
    if(!inst.dragging){ inst.theta += 0.0018; inst.updateCamera(); }
    renderer.render(scene, camera);
  })();

  return inst;
}

function rebuildPieceGeometry(inst){
  const H = THREE_BASE_HEIGHT * inst.custom.heightRatio;
  const body = inst.piece.userData.body;
  body.geometry.dispose();
  body.geometry = buildLatheGeometry(inst.design.shape_type, inst.custom.heightRatio);
  const handle = inst.piece.userData.handle;
  if(handle){ handle.position.set(THREE_MAX_RADIUS*0.3, H*0.5, 0); }
  const lid = inst.piece.userData.lid;
  if(lid){ lid.position.set(0, H+0.07, 0); }
  inst.updateCamera();
}
function rebuildPieceTexture(inst){
  const mat = inst.piece.userData.mat;
  if(mat.map) mat.map.dispose();
  mat.map = makePatternCanvasTexture(inst.design.shape_type, inst.design.pattern_type, inst.custom.primary, inst.custom.accent, inst.custom.density);
  mat.needsUpdate = true;
  const handleMat = inst.piece.userData.handleMat;
  if(handleMat) handleMat.color.set(inst.custom.primary);
  const lidMat = inst.piece.userData.lidMat;
  if(lidMat) lidMat.color.set(inst.custom.accent);
}

function wheelNav(){
  if(state.screen === 'home') return '';
  const idx = STEP_ORDER.indexOf(state.screen);
  const total = STEP_ORDER.length;
  const angle = ((idx+1)/total) * 360;
  const ticks = STEP_ORDER.map((s,i)=>{
    const a = (i/total)*360 - 90;
    const r = 46;
    const x = 60 + r*Math.cos(a*Math.PI/180);
    const y = 60 + r*Math.sin(a*Math.PI/180);
    const active = i <= idx;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${active ? 'var(--kiln)' : 'var(--line)'}" />`;
  }).join('');
  return `
  <div class="wheel-nav">
    <div class="wheel">
      <svg viewBox="0 0 120 120" style="transform:rotate(${angle}deg)">
        <circle cx="60" cy="60" r="46" fill="none" stroke="var(--line)" stroke-width="1.5"/>
        ${ticks}
      </svg>
      <div class="hub"></div>
    </div>
    <div class="wheel-step-name">${STEP_LABELS[state.screen]}</div>
    <div class="wheel-label">ขั้นตอนที่ ${idx+1} จาก ${total}</div>
  </div>`;
}

- pattern_type: ต้องเป็นค่าใดค่าหนึ่งจาก ["floral","geometric","wave","dots","minimal_line","glaze_drip"] เท่านั้น
- difficulty: ตัวเลข 1-5 (1=ง่ายมาก, 5=ยากมาก)
- why_th: คำอธิบายสั้นๆ ภาษาไทย (1-2 ประโยค) ว่าทำไมแบบนี้เหมาะกับไอเดียและระดับฝีมือของผู้ใช้
- primary_color: hex color สีหลักของชิ้นงานที่เข้ากับธีม
- accent_color: hex color สีลวดลาย ที่ตัดกับสีหลักพอเห็นชัด
ให้ความหลากหลายของ shape_type และ pattern_type ในแต่ละชุด อย่าซ้ำ shape_type เกิน 2 ครั้ง`;

  const userMsg = `ไอเดียของผู้ใช้: "${state.idea}"\nระดับฝีมือ: ${skillInfo.label} (เหมาะกับความยากระดับ 1-${skillInfo.max})`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: system,
        messages: [{ role:"user", content: userMsg }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content||[]).find(b=>b.type==='text');
    if(!textBlock) throw new Error('no text');
    let clean = textBlock.text.trim().replace(/^```json/,'').replace(/^```/,'').replace(/```$/,'').trim();
    let parsed = JSON.parse(clean);
    if(!Array.isArray(parsed)) throw new Error('not array');
    parsed = parsed.map((d,i)=>({
      id: 'd'+i,
      name_th: d.name_th || 'แบบไม่มีชื่อ',
      shape_type: SHAPE_PROFILES[d.shape_type] ? d.shape_type : 'vase',
      pattern_type: PATTERN_NAMES[d.pattern_type] ? d.pattern_type : 'minimal_line',
      difficulty: Math.max(1, Math.min(5, Math.round(Number(d.difficulty)||3))),
      why_th: d.why_th || '',
      primary_color: /^#[0-9a-fA-F]{6}$/.test(d.primary_color) ? d.primary_color : '#C9AD8C',
      accent_color: /^#[0-9a-fA-F]{6}$/.test(d.accent_color) ? d.accent_color : '#2B2622',
    }));
    state.designs = parsed;
  }catch(e){
    state.loadError = 'ขออภัย เกิดปัญหาระหว่างสร้างแบบด้วย AI ลองใหม่อีกครั้ง หรือปรับไอเดียให้ชัดเจนขึ้น';
  }
  state.loading = false;
  render();
}

/* =========================================================
   SCREEN: RESULTS
   ========================================================= */
function screenResults(){
  if(state.loading){
    return chrome(`
      <div class="loading-wrap">
        <div class="throwing">
          <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="46" fill="none" stroke="var(--celadon)" stroke-width="3" stroke-dasharray="8 10"/></svg>
        </div>
        <div class="loading-text">AI กำลังปั้นไอเดียของคุณให้เป็นแบบร่าง...</div>
      </div>`);
  }
  if(state.loadError){
    return chrome(`
      <div class="empty-state">
        <p>${state.loadError}</p>
        <div class="btn-row" style="justify-content:center;">
          <button class="btn btn-primary" onclick="startGeneration()">ลองอีกครั้ง</button>
          <button class="btn btn-ghost" onclick="go('idea')">แก้ไอเดีย</button>
        </div>
      </div>`);
  }
  const skillInfo = SKILL_LEVELS[state.skill];
  const filtered = state.designs.filter(d => d.difficulty <= skillInfo.max);
  if(filtered.length === 0){
    return chrome(`
      <div class="empty-state">
        <p>ยังไม่มีแบบที่เหมาะกับระดับ "${skillInfo.label}" จากไอเดียนี้ ลองปรับไอเดียให้เรียบง่ายขึ้น หรือเลือกระดับฝีมือที่สูงขึ้น</p>
        <div class="btn-row" style="justify-content:center;">
          <button class="btn btn-primary" onclick="go('idea')">แก้ไอเดีย</button>
          <button class="btn btn-ghost" onclick="go('skill')">เปลี่ยนระดับฝีมือ</button>
        </div>
      </div>`);
  }
  const cards = filtered.map(d=>{
    const picked = state.selectedForCompare.includes(d.id);
    return `
    <div class="card design-card ${picked?'picked':''}">
      <div class="pick-toggle" onclick="toggleCompare('${d.id}')">${picked?'✓':'+'}</div>
      ${renderVesselSVG(d,{})}
      <div class="piece-name">${d.name_th}</div>
      <span class="diff-badge ${diffClass(d.difficulty)}">${SHAPE_NAMES[d.shape_type]} · ${PATTERN_NAMES[d.pattern_type]} · ${difficultyStars(d.difficulty)}</span>
      <div class="why">${d.why_th}</div>
    </div>`;
  }).join('');

  return chrome(`
    <div class="eyebrow">ขั้นตอนที่ 3</div>
    <h1 class="title display">แบบที่ AI คิดให้จากไอเดียของคุณ</h1>
    <p class="lead">เลือก 2-3 แบบที่ถูกใจ (กดปุ่ม + บนการ์ด) เพื่อนำไปเปรียบเทียบกัน</p>
    <div class="results-grid">${cards}</div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="go('skill')">← เปลี่ยนระดับฝีมือ</button>
      <button class="btn btn-ghost" onclick="startGeneration()">สร้างแบบใหม่</button>
      <button class="btn btn-primary" ${state.selectedForCompare.length<1?'disabled':''} onclick="go('compare')">เปรียบเทียบ (${state.selectedForCompare.length})</button>
    </div>
  `);
}
function toggleCompare(id){
  const i = state.selectedForCompare.indexOf(id);
  if(i>=0){ state.selectedForCompare.splice(i,1); }
  else{
    if(state.selectedForCompare.length>=3){ state.selectedForCompare.shift(); }
    state.selectedForCompare.push(id);
  }
  render();
}

/* =========================================================
   SCREEN: COMPARE
   ========================================================= */
function screenCompare(){
  const picks = state.designs.filter(d=>state.selectedForCompare.includes(d.id));
  if(picks.length===0){
    return chrome(`<div class="empty-state"><p>ยังไม่ได้เลือกแบบไว้เปรียบเทียบ</p>
      <div class="btn-row" style="justify-content:center;"><button class="btn btn-primary" onclick="go('results')">กลับไปเลือกแบบ</button></div></div>`);
  }
  const header = `<div class="compare-row"><div></div>${picks.map(p=>`<div>${p.name_th}</div>`).join('')}</div>`;
  const visualRow = `<div class="compare-row"><div class="compare-label">รูปทรง</div>${picks.map(p=>`<div class="compare-visual">${renderVesselSVG(p,{})}</div>`).join('')}</div>`;
  const shapeRow = `<div class="compare-row"><div class="compare-label">ทรง / ลาย</div>${picks.map(p=>`<div>${SHAPE_NAMES[p.shape_type]} · ${PATTERN_NAMES[p.pattern_type]}</div>`).join('')}</div>`;
  const diffRow = `<div class="compare-row"><div class="compare-label">ความยาก</div>${picks.map(p=>`<div class="stars">${difficultyStars(p.difficulty)} <span class="mono" style="color:var(--ink-soft)">${p.difficulty}/5</span></div>`).join('')}</div>`;
  const whyRow = `<div class="compare-row"><div class="compare-label">ทำไมเหมาะกับคุณ</div>${picks.map(p=>`<div style="font-size:0.85rem;color:var(--ink-soft);">${p.why_th}</div>`).join('')}</div>`;
  const pickRow = `<div class="compare-row"><div class="compare-label">เลือกแบบนี้</div>${picks.map(p=>`<button class="btn btn-primary" style="padding:9px 16px;font-size:0.85rem;" onclick="chooseDesign('${p.id}')">เลือกไปปรับแต่ง</button>`).join('')}</div>`;

  return chrome(`
    <div class="eyebrow">ขั้นตอนที่ 4</div>
    <h1 class="title display">เปรียบเทียบแบบที่เลือก</h1>
    <p class="lead">ดูความแตกต่างของแต่ละแบบ แล้วเลือก 1 แบบเพื่อไปปรับแต่งขนาดและสี</p>
    <div class="card compare-grid" style="padding:8px 20px;">
      ${header}${visualRow}${shapeRow}${diffRow}${whyRow}${pickRow}
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="go('results')">← เลือกแบบอื่นเพิ่ม</button>
    </div>
  `);
}
function chooseDesign(id){
  const d = state.designs.find(x=>x.id===id);
  state.chosenDesign = d;
  state.customize = { heightRatio:1, density:1, primary:d.primary_color, accent:d.accent_color };
  go('customize');
}

/* =========================================================
   SCREEN: CUSTOMIZE
   ========================================================= */
function liveDifficulty(){
  const base = state.chosenDesign.difficulty;
  const sizeDev = Math.abs(state.customize.heightRatio - 1) * 2.2;
  const densityDev = Math.max(0, state.customize.density - 1) * 1.6;
  return Math.max(1, Math.min(5, Math.round(base + sizeDev + densityDev)));
}
function screenCustomize(){
  const d = state.chosenDesign;
  if(!d){ return chrome(`<div class="empty-state"><p>ยังไม่ได้เลือกแบบ</p><div class="btn-row" style="justify-content:center;"><button class="btn btn-primary" onclick="go('results')">ไปเลือกแบบ</button></div></div>`); }
  const liveDiff = liveDifficulty();
  const skillMax = SKILL_LEVELS[state.skill].max;
  const overLimit = liveDiff > skillMax;
  const has3D = typeof THREE !== 'undefined';
  const preview3D = `
    <div class="three-wrap" id="three-customize-container"></div>
    <div class="three-hint">ลากเพื่อหมุนดูรอบด้าน • เลื่อนล้อเมาส์เพื่อซูม</div>`;
  const previewFallback = `
    ${renderVesselSVG({ ...d, primary_color: state.customize.primary, accent_color: state.customize.accent }, { heightRatio: state.customize.heightRatio, density: state.customize.density })}
    <div class="three-fallback-note">โหลดมุมมอง 3 มิติไม่สำเร็จ แสดงเป็นภาพ 2 มิติแทน</div>`;
  return chrome(`
    <div class="eyebrow">ขั้นตอนที่ 5</div>
    <h1 class="title display">ปรับแต่งแบบของคุณ</h1>
    <p class="lead">หมุนดูชิ้นงานแบบ 3 มิติ ปรับขนาด ความหนาแน่นของลวดลาย และสี ระบบจะคำนวณความยากใหม่ให้แบบเรียลไทม์</p>
    <div class="customize-layout">
      <div class="card customize-preview">
        ${has3D ? preview3D : previewFallback}
        <div id="diffLiveText" class="diff-live">ความยากตอนนี้: <span class="stars">${difficultyStars(liveDiff)}</span> ${liveDiff}/5</div>
        <div id="warnBanner" style="width:100%;">${overLimit ? `<div class="warn-banner">การปรับแต่งนี้ยากเกินระดับ "${SKILL_LEVELS[state.skill].label}" ที่เลือกไว้ ลองลดขนาดหรือความหนาแน่นของลายลง</div>` : ''}</div>
      </div>
      <div class="card" style="padding:24px;">
        <div class="control-group">
          <label>ขนาด (สูง/เตี้ย) <span class="mono" id="hrLabel">${state.customize.heightRatio.toFixed(2)}x</span></label>
          <input type="range" min="0.6" max="1.8" step="0.02" value="${state.customize.heightRatio}" oninput="updateCustom('heightRatio', this.value)">
        </div>
        <div class="control-group">
          <label>ความหนาแน่นลวดลาย <span class="mono" id="densLabel">${state.customize.density.toFixed(2)}x</span></label>
          <input type="range" min="0.5" max="2" step="0.02" value="${state.customize.density}" oninput="updateCustom('density', this.value)">
        </div>
        <div class="control-group">
          <label>สี</label>
          <div class="color-row">
            <div class="color-pick">สีหลัก<input type="color" value="${state.customize.primary}" oninput="updateCustom('primary', this.value)"></div>
            <div class="color-pick">สีลวดลาย<input type="color" value="${state.customize.accent}" oninput="updateCustom('accent', this.value)"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="go('compare')">← กลับไปเปรียบเทียบ</button>
      <button class="btn btn-primary" onclick="confirmDesign()">ยืนยันแบบนี้</button>
    </div>
  `);
}
function updateCustom(key, val){
  const v = (key==='primary'||key==='accent') ? val : parseFloat(val);
  state.customize[key] = v;

  if(!threeCustom){
    // no 3D instance (fallback mode) -> full re-render to update the 2D SVG preview
    render();
    return;
  }

  const hrLabel = document.getElementById('hrLabel');
  if(hrLabel && key==='heightRatio') hrLabel.textContent = v.toFixed(2)+'x';
  const densLabel = document.getElementById('densLabel');
  if(densLabel && key==='density') densLabel.textContent = v.toFixed(2)+'x';

  if(key==='heightRatio'){ rebuildPieceGeometry(threeCustom); }
  if(key==='density' || key==='primary' || key==='accent'){ rebuildPieceTexture(threeCustom); }

  updateDifficultyUI();
}
function updateDifficultyUI(){
  const liveDiff = liveDifficulty();
  const skillMax = SKILL_LEVELS[state.skill].max;
  const overLimit = liveDiff > skillMax;
  const diffEl = document.getElementById('diffLiveText');
  if(diffEl) diffEl.innerHTML = `ความยากตอนนี้: <span class="stars">${difficultyStars(liveDiff)}</span> ${liveDiff}/5`;
  const warnEl = document.getElementById('warnBanner');
  if(warnEl) warnEl.innerHTML = overLimit ? `<div class="warn-banner">การปรับแต่งนี้ยากเกินระดับ "${SKILL_LEVELS[state.skill].label}" ที่เลือกไว้ ลองลดขนาดหรือความหนาแน่นของลายลง</div>` : '';
}
function confirmDesign(){
  state.chosenDesign = { ...state.chosenDesign, primary_color: state.customize.primary, accent_color: state.customize.accent, difficulty: liveDifficulty() };
  go('confirm');
}

/* =========================================================
   SCREEN: CONFIRM & DOWNLOAD
   ========================================================= */
function screenConfirm(){
  const d = state.chosenDesign;
  if(!d){ return chrome(`<div class="empty-state"><p>ยังไม่ได้เลือกแบบ</p></div>`); }
  const steps = STEP_TEMPLATES[d.shape_type] || STEP_TEMPLATES.vase;
  const extraStep = d.difficulty >= 4 ? '<li>เทคนิคขั้นสูง: ควบคุมความหนาผนังให้สม่ำเสมอตลอดชิ้นงาน เพื่อลดความเสี่ยงแตกร้าวตอนเผา</li>' : '';
  const has3D = typeof THREE !== 'undefined';
  const preview3D = `
    <div class="three-wrap" id="three-confirm-container" style="height:300px;"></div>
    <div class="three-hint">ลากเพื่อหมุนดูรอบด้าน</div>`;
  const previewFallback = renderVesselSVG(d, { heightRatio: state.customize.heightRatio, density: state.customize.density });
  return chrome(`
    <div class="eyebrow">ขั้นตอนที่ 6</div>
    <h1 class="title display">พร้อมลงมือปั้นแล้ว</h1>
    <p class="lead">นี่คือแบบร่างสุดท้ายของคุณ พร้อมคู่มือขั้นตอนคร่าวๆ ดาวน์โหลดเก็บไว้อ่านระหว่างปั้นได้เลย</p>
    <div class="confirm-layout">
      <div class="card confirm-visual">
        ${has3D ? preview3D : previewFallback}
        <div class="piece-name" style="margin-top:10px;">${d.name_th}</div>
        <span class="diff-badge ${diffClass(d.difficulty)}">${difficultyStars(d.difficulty)} ระดับ ${d.difficulty}/5</span>
      </div>
      <div class="card" style="padding:24px;">
        <h2 class="title">ขั้นตอนการปั้น</h2>
        <ul class="steps-list">
          ${steps.map(s=>`<li>${s}</li>`).join('')}
          ${extraStep}
        </ul>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="go('customize')">← กลับไปปรับแต่ง</button>
      <button class="btn btn-primary" onclick="downloadGuide()">ดาวน์โหลดคู่มือ (.txt)</button>
      <button class="btn btn-ghost" onclick="go('home')">เริ่มออกแบบชิ้นใหม่</button>
    </div>
  `);
}
function downloadGuide(){
  const d = state.chosenDesign;
  const steps = STEP_TEMPLATES[d.shape_type] || STEP_TEMPLATES.vase;
  let content = `ปั้นดิน.AI — คู่มือแบบร่างเซรามิก\n`;
  content += `================================\n\n`;
  content += `ชื่อแบบ: ${d.name_th}\n`;
  content += `ทรง: ${SHAPE_NAMES[d.shape_type]}\n`;
  content += `ลวดลาย: ${PATTERN_NAMES[d.pattern_type]}\n`;
  content += `ระดับความยาก: ${d.difficulty}/5\n`;
  content += `สีหลัก: ${d.primary_color}   สีลวดลาย: ${d.accent_color}\n`;
  content += `เหตุผลที่แนะนำ: ${d.why_th || '-'}\n\n`;
  content += `ขั้นตอนการปั้น:\n`;
  steps.forEach((s,i)=>{ content += `${i+1}. ${s}\n`; });
  if(d.difficulty>=4) content += `${steps.length+1}. เทคนิคขั้นสูง: ควบคุมความหนาผนังให้สม่ำเสมอตลอดชิ้นงาน\n`;
  content += `\n(ไฟล์นี้สร้างจากต้นแบบสาธิต โปรดปรึกษาครูปั้นหรือสตูดิโอก่อนลงมือจริง)\n`;

  const blob = new Blob([content], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pandin-${d.name_th.replace(/\s+/g,'-')}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* =========================================================
   ROUTER / RENDER
   ========================================================= */
function render(){
  if(threeCustom){ disposeThreeInstance(threeCustom); threeCustom = null; }
  if(threeConfirm){ disposeThreeInstance(threeConfirm); threeConfirm = null; }

  let html = '';
  switch(state.screen){
    case 'home': html = screenHome(); break;
    case 'idea': html = screenIdea(); break;
    case 'skill': html = screenSkill(); break;
    case 'results': html = screenResults(); break;
    case 'compare': html = screenCompare(); break;
    case 'customize': html = screenCustomize(); break;
    case 'confirm': html = screenConfirm(); break;
    default: html = screenHome();
  }
  document.getElementById('app').innerHTML = html;

  if(state.screen === 'customize' && state.chosenDesign && typeof THREE !== 'undefined'){
    threeCustom = buildThreeScene('three-customize-container', state.chosenDesign, state.customize, true);
  }
  if(state.screen === 'confirm' && state.chosenDesign && typeof THREE !== 'undefined'){
    threeConfirm = buildThreeScene('three-confirm-container', state.chosenDesign,
      { heightRatio: state.customize.heightRatio, density: state.customize.density, primary: state.chosenDesign.primary_color, accent: state.chosenDesign.accent_color },
      true);
  }
}
render();
</script>
</body>
</html>
