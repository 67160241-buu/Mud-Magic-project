services:
  api:
    build: ./api
    container_name: mudmagic_api
    restart: unless-stopped
    env_file:
      - ./api/.env
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app
    # entrypoint.sh execs uvicorn; this just adds --reload for local dev.
    command: ["--reload"]

  web:
    image: nginx:alpine
    container_name: mudmagic_web
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api
