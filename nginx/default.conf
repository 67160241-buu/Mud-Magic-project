# Dev-only nginx config: tell browsers never to reuse stale HTML/JS/CSS,
# so edits in ./web show up on a normal refresh.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;

    location / {
        try_files $uri $uri/ =404;
    }
}
