name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: project_user
          POSTGRES_PASSWORD: project_pass
          POSTGRES_DB: project_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project_user -d project_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://project_user:project_pass@localhost:5432/project_db_test
      JWT_SECRET_KEY: ci-test-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Alembic migrations (sanity check they apply cleanly)
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
