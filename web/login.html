<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue your creative journey.</p>

<form id="login-form" class="space-y-6" novalidate>
<div class="space-y-4">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 uppercase" for="email">Email Address</label>
<input class="w-full bg-surface-container-lowest border border-outline rounded text-on-background font-body-md text-body-md px-4 py-3 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="email" placeholder="you@example.com" type="email" autocomplete="email" />
<p class="text-error text-xs mt-1 hidden" data-error-for="email">Enter a valid email address.</p>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 uppercase" for="password">Password</label>
<input class="w-full bg-surface-container-lowest border border-outline rounded text-on-background font-body-md text-body-md px-4 py-3 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="password" placeholder="••••••••" type="password" autocomplete="current-password" />
<p class="text-error text-xs mt-1 hidden" data-error-for="password">Password must be at least 6 characters.</p>
</div>
</div>

<button id="login-submit" class="w-full bg-primary text-on-primary font-label-sm text-label-sm uppercase py-4 rounded hover:bg-surface-tint transition-colors shadow-sm mt-8 flex items-center justify-center gap-2" type="submit">
<span id="login-submit-label">Continue</span>

<div class="flex-grow border-t border-outline-variant"></div>

<div class="flex-grow border-t border-outline-variant"></div>

<script src="js/api-client.js"></script>
<script src="js/main.js"></script>
<script>
  // Real auth flow against the Project API (see ../api). The form only
  // collects an email, so we derive a username and try register-then-login
  // (see api-client.js for the exact contract) — a single field acts as
  // both sign-up and sign-in.
  (function () {
    const form = document.getElementById("login-form");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const submitBtn = document.getElementById("login-submit");
    const submitLabel = document.getElementById("login-submit-label");
    const spinner = document.getElementById("login-spinner");

    function setError(input, show) {
      const msg = document.querySelector(`[data-error-for="${input.id}"]`);
      input.classList.toggle("border-error", show);
      if (msg) msg.classList.toggle("hidden", !show);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
      const passwordValid = password.value.length >= 6;
      setError(email, !emailValid);
      setError(password, !passwordValid);
      if (!emailValid || !passwordValid) return;

      submitBtn.disabled = true;
      submitLabel.textContent = "Signing in";
      spinner.classList.remove("hidden");

      try {
        const user = await window.MudMagicAPI.registerOrLogin(email.value.trim(), password.value);
        window.MudMagic?.showToast(`Signed in as ${user.username}`, { icon: "check_circle" });
        window.setTimeout(() => {
          window.location.href = "studio.html";
        }, 500);
      } catch (err) {
        submitBtn.disabled = false;
        submitLabel.textContent = "Continue";
        spinner.classList.add("hidden");
        const message =
          err.message === "Failed to fetch"
            ? "Can't reach the API — make sure the backend is running (see README)."
            : err.message || "Something went wrong. Try again.";
        window.MudMagic?.showToast(message, { icon: "error" });
      }
    });

    document.querySelectorAll("[data-provider]").forEach((btn) => {
      btn.addEventListener("click", () => {
        window.MudMagic?.showToast(`${btn.dataset.provider} sign-in isn't wired up in this demo`, { icon: "info" });
      });
    });
  })();
</script>
