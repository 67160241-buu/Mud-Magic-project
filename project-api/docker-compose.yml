services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectpass}
      POSTGRES_DB: ${POSTGRES_DB:-projectdb}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectuser} -d ${POSTGRES_DB:-projectdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # ประกอบ DATABASE_URL จากค่า POSTGRES_* ด้านบน ให้ api ต่อไปยัง service "db" (ชื่อ service = hostname ใน network ของ Compose)
      DATABASE_URL: postgresql://${POSTGRES_USER:-projectuser}:${POSTGRES_PASSWORD:-projectpass}@db:5432/${POSTGRES_DB:-projectdb}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app # bind mount เพื่อให้ --reload เห็นไฟล์ที่แก้ระหว่าง dev ทันที
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
